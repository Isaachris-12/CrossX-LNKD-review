services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crossx
      POSTGRES_PASSWORD: crossx
      POSTGRES_DB: crossx
    ports:
      - "5432:5432"
    volumes:
      - crossx_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  crossx_postgres_data:
